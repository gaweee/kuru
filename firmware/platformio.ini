; kuru firmware: ESP-IDF (C) built through PlatformIO.
; pioarduino's platform is used only because the stock PlatformIO espressif32
; platform ships an outdated ESP-IDF. No Arduino framework is used.
[platformio]
src_dir = main

[env:knob]
; Pinned: pioarduino "stable" (55.03.312) was rejected by PlatformIO Core 6.2.0.post1.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; PlatformIO checks the image against the board definition (8 MB), not partitions.csv: keep in sync with the factory partition.
board_upload.maximum_size = 14680064
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -Wall -Wextra

; Perf build: logs frame periods and injects a synthetic fast spin (no hardware input needed).
[env:knob_perf]
extends = env:knob
build_flags = ${env:knob.build_flags} -DKURU_PERF=1

; Perf build + synthetic fast spin 3 s after boot.
[env:knob_synth]
extends = env:knob_perf
build_flags = ${env:knob_perf.build_flags} -DKURU_SYNTH_ABLATE=1

; Perf tour: every device gets a hard spin, a settle period, its idle animation and a curtain move, then device switches;
; per-second frame statistics are logged per phase (see perf_tour in main/main.c).
; A new environment compiles every asset (~50 min). To skip that, temporarily put
;   #define KURU_PERF 1 / #define KURU_SYNTH_TOUR 1
; at the top of main.c, and #define KURU_PERF 1 at the top of board.c and ui_screen.c, build env `knob`, then remove them.
[env:knob_tour]
extends = env:knob_perf
build_flags = ${env:knob_perf.build_flags} -DKURU_SYNTH_TOUR=1
